<title>__TITLE__</title>

<style>
/* No bundled faces: the renderer asks for "Roboto, sans-serif" and hosts that have Roboto
   (Android, ChromeOS, most Linux) still get it, while everyone else falls back cleanly. */

/* Light is the bare :root; cool-biased neutrals to sit beside the editor grey. */
:root{
  --font-ui:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Roboto Condensed",Roboto,system-ui,-apple-system,"Segoe UI Semibold",sans-serif;
  --ground:#f4f6f8;
  --surface:#ffffff;
  --ink:#151a22;
  --ink-soft:#5b6673;
  --line:#dee3ea;
  --accent:#c25f16;
  --accent-soft:#f3e3d6;
  --code-ground:#eef1f5;
  --shadow:0 1px 2px rgba(21,26,34,.06),0 8px 24px rgba(21,26,34,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1117;
    --surface:#161b23;
    --ink:#e6eaf0;
    --ink-soft:#93a0b1;
    --line:#252c37;
    --accent:#f0913f;
    --accent-soft:#2a1e14;
    --code-ground:#11151c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1117;
  --surface:#161b23;
  --ink:#e6eaf0;
  --ink-soft:#93a0b1;
  --line:#252c37;
  --accent:#f0913f;
  --accent-soft:#2a1e14;
  --code-ground:#11151c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:48px 24px 80px;display:flex;flex-direction:column;gap:32px}

.eyebrow{
  font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--accent);margin:0;
}
h1{
  font-family:var(--font-display);
  font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:-.01em;margin:10px 0 0;
  text-wrap:balance;
}
.dek{margin:14px 0 0;max-width:62ch;color:var(--ink-soft);font-size:17px}
.dek:empty{display:none}

/* Where a module sits in the simulation. A script graph is only half the answer -- the other
   half is which stage runs it -- and that is one row, not a second diagram. */
.stages{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.stages li{
  font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;line-height:1;
  color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;
}
.stages li[aria-current]{
  color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600;
}

/* The graph panel stays in the engine's own dark world on purpose. A material chain is far
   wider than it is tall, so let the panel break out of the reading column — every extra
   pixel of width is a node that stays legible instead of being scaled away. */
.panel{
  width:min(94vw,1560px);
  margin-left:calc(50% - min(47vw,780px));
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:#262626;box-shadow:var(--shadow);
}

.src-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h2{font-family:var(--font-display);font-size:22px;letter-spacing:-.005em;margin:0}
.sub{margin:6px 0 0;color:var(--ink-soft);font-size:15px;max-width:62ch}
code{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:.92em}
button{
  font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:5px;padding:8px 14px;cursor:pointer;
}
button:hover{background:var(--accent);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{
  margin:12px 0 0;background:var(--code-ground);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;overflow-x:auto;max-height:320px;overflow-y:auto;
  font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12.5px;line-height:1.65;
  color:var(--ink);tab-size:3;
}
h3{font-family:var(--font-display);font-size:17px;margin:0}
.sub.wide{max-width:74ch}
.prose-list{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:15px;max-width:74ch}
.prose-list li{margin:4px 0}
section{display:flex;flex-direction:column;gap:14px}
section > h2{margin-bottom:-4px}

/* ---- emitter stack: a list, drawn as one. No wires, so no graph. ---- */
.stack-head{margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.emitter{font-family:var(--font-display);font-size:19px;font-weight:600}
.emitter-note{color:var(--ink-soft);font-size:13.5px}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:900px}
.stack .stage{margin-top:14px}
.stack .stage:first-child{margin-top:0}
.stage-name{
  display:inline-block;font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--accent);
  border-bottom:1px solid var(--line);padding-bottom:5px;width:100%;
}
.module{
  list-style:none;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:8px;padding:12px 16px;
}
.module.scratch{border-left-color:var(--accent)}
.module.set{border-left-style:dashed}
.module.empty{opacity:.5;text-align:center;padding:8px}
.mod-name{font-weight:600;font-size:15.5px}
.mod-note{color:var(--ink-soft);font-size:13px;margin-left:10px}
.inputs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.inputs.nested{margin:4px 0 2px 18px;padding-left:12px;border-left:1px solid var(--line)}
.inputs li{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.in-name{color:var(--ink-soft);min-width:16ch}
.in-value{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:13px}
.in-link{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:13px;color:var(--accent)}
.in-link::before{content:"→ ";font-family:var(--font-ui)}

.foot{color:var(--ink-soft);font-size:13.5px;border-top:1px solid var(--line);padding-top:20px}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
// A page can hold any number of graphs, so everything below works per panel rather than on the
// one-and-only. Each graph panel carries its source in a sibling textarea.
document.querySelectorAll(".panel[data-graph]").forEach((panel) => {
  const source = document.getElementById(panel.dataset.graph);
  const stage = panel.querySelector(".playground");
  new window.blueprintUE.render.Main(source.value, stage, { height: panel.dataset.height }).start();

  // The renderer opens at 1:1 with the graph pinned to the top-left, so anything wider than the
  // frame hangs off the edge. Scale the canvas to the node bounding box once on load; the
  // toolbar's own zoom and pan take over from there.
  const fit = () => {
    const root = stage.querySelector(".bue-render") ?? panel.querySelector(".bue-render");
    const frame = root?.querySelector(".frame");
    const canvas = root?.querySelector(".canvas");
    const nodes = [...(root?.querySelectorAll(".node") ?? [])];
    // Nodes are built asynchronously after start(), so report back and let the caller retry.
    if (!frame || !canvas || !nodes.length || !frame.clientWidth) return false;

    // Undo the current pan/zoom to recover canvas-space coordinates.
    const m = new DOMMatrixReadOnly(getComputedStyle(canvas).transform);
    const scale0 = m.a || 1;
    const view = frame.getBoundingClientRect();
    const rects = nodes.map((n) => n.getBoundingClientRect());
    const toCanvas = (v, origin, offset) => (v - origin - offset) / scale0;
    const box = {
      l: Math.min(...rects.map((r) => toCanvas(r.left, view.left, m.e))),
      t: Math.min(...rects.map((r) => toCanvas(r.top, view.top, m.f))),
      r: Math.max(...rects.map((r) => toCanvas(r.right, view.left, m.e))),
      b: Math.max(...rects.map((r) => toCanvas(r.bottom, view.top, m.f))),
    };

    // Wires bow outside the node boxes, so pad the bounds or the curves clip at the edges.
    const pad = 70;
    box.l -= pad; box.t -= pad; box.r += pad; box.b += pad;

    const width = box.r - box.l, height = box.b - box.t;
    if (!(width > 0 && height > 0)) return false;
    const scale = Math.min(frame.clientWidth / width, frame.clientHeight / height, 1);
    const x = (frame.clientWidth - width * scale) / 2 - box.l * scale;
    const y = (frame.clientHeight - height * scale) / 2 - box.t * scale;
    canvas.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    return true;
  };

  // The renderer's fullscreen button calls requestFullscreen() and then resizes the frame
  // whether or not the request was granted. Inside the artifact viewer it never is — the page is
  // framed cross-origin with no allow="fullscreen" — so the frame grows to screen height and the
  // only way back is a fullscreenchange event that never fires. Where the API is unavailable,
  // take the button away rather than leave a control that strands the reader.
  const dropFullscreen = () => {
    if (document.fullscreenEnabled) return;
    panel.querySelectorAll(".frame-header__buttons-fullscreen").forEach((b) => b.remove());
  };

  let attempts = 0;
  const tryFit = () => { dropFullscreen(); if (!fit() && ++attempts < 60) setTimeout(tryFit, 50); };
  tryFit();
  addEventListener("resize", fit);
});

// navigator.clipboard is not an option here: the artifact viewer frames this page cross-origin
// with no Permissions Policy delegation, so clipboard-write is never granted and writeText()
// always rejects. Selecting the block is not permission-gated and always works, so that is what
// the button promises; execCommand may also land, and when it does the label upgrades itself.
document.querySelectorAll("button[data-copies]").forEach((btn) => {
  const src = document.getElementById(btn.dataset.copies);
  btn.addEventListener("click", () => {
    const range = document.createRange();
    range.selectNodeContents(src);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

    let copied = false;
    try { copied = document.execCommand("copy"); } catch { copied = false; }

    const original = btn.dataset.label ?? btn.textContent;
    btn.dataset.label = original;
    btn.textContent = copied ? "Copied" : "Selected — press Ctrl+C";
    setTimeout(() => { btn.textContent = original; }, 6000);
  });
});
</script>
